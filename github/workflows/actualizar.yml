name: Actualizar datos

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 min (GitHub no baja de 5 y en horario pico se demora)
  workflow_dispatch:          # botón para correrlo a mano
  push:
    branches: [main]
    paths: ['manual.json', 'finales.json', 'config.json', 'scripts/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: datos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Armar datos.json
        run: node scripts/build-datos.js

      - name: Commitear si cambió
        run: |
          git config user.name  "pincha-bot"
          git config user.email "actions@github.com"
          git add public/datos.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Avisa por mail abriendo un issue. Si ya hay uno abierto lo actualiza en
      # vez de abrir otro, y lo cierra cuando se resuelve.
      - name: Avisar si falta cargar algo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Falta cargar datos a mano"
          FALTANTES=$(node -e "
            const d = require('./public/datos.json');
            console.log((d.faltantes || []).map(x => '- ' + x).join('\n'));
          ")

          ABIERTO=$(gh issue list --state open --search "$TITULO in:title" --json number --jq '.[0].number // empty')

          if [ -z "$FALTANTES" ]; then
            if [ -n "$ABIERTO" ]; then
              gh issue comment "$ABIERTO" --body "Ya está todo cargado. Cierro."
              gh issue close "$ABIERTO"
            fi
            echo "Nada pendiente."
            exit 0
          fi

          CUERPO=$(printf 'La app no encontró estos datos:\n\n%s\n\n---\nSe cargan a mano en `manual.json` (o en `finales.json` si es una final). Guardás y en un par de minutos está en la app.\n\nÚltima revisión: %s' "$FALTANTES" "$(date -u '+%d/%m/%Y %H:%M UTC')")

          if [ -n "$ABIERTO" ]; then
            gh issue edit "$ABIERTO" --body "$CUERPO"
            echo "Issue #$ABIERTO actualizado."
          else
            gh issue create --title "$TITULO" --body "$CUERPO"
            echo "Issue creado."
          fi
